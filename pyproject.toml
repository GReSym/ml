[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Иван Гриненко", email = "4l1kku@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.0",
    "fastapi[standard]>=0.143.0",
    "fastembed>=0.9.0",
    "onnxruntime>=1.23",
    "pymilvus>=3.0.2",
    "pymysql>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

# uv.lock always pins the CPU build. A ROCm/CUDA torch is swapped in at Docker build time (TORCH_BACKEND in
# deploy/.env) without locking: nightly GPU wheels are deleted from the index after a few weeks.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
